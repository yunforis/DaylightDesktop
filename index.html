<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121412" />
    <meta name="description" content="Daylight — 从一封邮件，到一段安排。你的本地日历与邮件助手。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Sora:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Daylight — 从邮件到安排</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #f7f7f5; color: #1a1a1a; }
      html.dark, html.dark body { background: #141414; color: #f5f5f5; }
      #daylight-boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background:
          radial-gradient(900px 520px at 50% -10%, rgba(180, 200, 210, 0.35), transparent 58%),
          linear-gradient(180deg, #f7f7f5 0%, #fafaf8 100%);
        font-family: "Sora", "Noto Sans SC", system-ui, sans-serif;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      html.dark #daylight-boot {
        background:
          radial-gradient(900px 520px at 50% -10%, rgba(60, 80, 110, 0.35), transparent 58%),
          linear-gradient(180deg, #141414 0%, #101010 100%);
      }
      #daylight-boot[data-done="1"] { opacity: 0; visibility: hidden; pointer-events: none; }
      #daylight-boot .mark {
        width: 48px; height: 48px; border-radius: 16px;
        display: grid; place-items: center;
        background: #ffffff;
        box-shadow: 0 8px 24px rgba(0,0,0,0.08), inset 0 0 0 1px rgba(0,0,0,0.06);
      }
      #daylight-boot .mark img { width: 40px; height: 40px; object-fit: contain; display: block; }
      #daylight-boot .label {
        margin-top: 16px; font-size: 13px; opacity: 0.55;
        display: flex; align-items: center; gap: 8px;
      }
      #daylight-boot .spin {
        width: 14px; height: 14px; border: 2px solid currentColor;
        border-right-color: transparent; border-radius: 50%;
        animation: daylight-spin 0.7s linear infinite;
      }
      @keyframes daylight-spin { to { transform: rotate(360deg); } }
      #root:empty { min-height: 100svh; }
    </style>
    <script>
      try {
        if (localStorage.getItem('daylight-mode') === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="daylight-boot" aria-live="polite" aria-busy="true">
      <div style="text-align:center">
        <div class="mark"><img src="/logo.png" alt="" /></div>
        <div class="label"><span class="spin" aria-hidden="true"></span>正在进入 Daylight…</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
