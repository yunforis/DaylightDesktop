name: release

# 打标签即发布：六平台安装包 + 自动更新用的 latest.json。
# 触发方式（二选一）：
#   1) 推一个版本标签：  git tag v0.1.0 && git push origin v0.1.0
#   2) Actions 页面手动运行本工作流，填一个标签；勾上 draft 则只产出**草稿** Release，
#      用来在不公开的前提下验证六平台能不能都出包（勾掉 draft 再跑一次即可正式发布）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '版本标签，例如 v0.1.0（标签不存在时会在本次运行的提交上创建）'
        required: true
      draft:
        description: '只产出草稿 Release（不公开），用于验证六平台构建'
        type: boolean
        default: false

# tauri-action 需要写权限来创建 Release 并上传产物。
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 先挡住「标签版本与代码里的版本不一致」这一类最容易发错包的问题。
  guard:
    name: 校验版本
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      draft: ${{ steps.flags.outputs.draft }}
      releaseId: ${{ steps.release.outputs.releaseId }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: check
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          case "$tag" in
            v*) ;;
            *) echo "::error::标签必须以 v 开头（当前 '$tag'）。推送形如 v0.1.0 的标签，或手动运行时填写它。"; exit 1 ;;
          esac
          version="${tag#v}"
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "标签：$tag"
          echo "package.json=$pkg  tauri.conf.json=$conf  Cargo.toml=$cargo"
          for pair in "package.json:$pkg" "src-tauri/tauri.conf.json:$conf" "src-tauri/Cargo.toml:$cargo"; do
            file="${pair%%:*}"; value="${pair#*:}"
            if [ "$value" != "$version" ]; then
              echo "::error::$file 的版本是 $value，与标签 $tag 不一致。请把三处版本都改成 $version 并提交，再重新打标签。"
              exit 1
            fi
          done
          # 应用版本号以 tauri.conf.json 为准：自动更新就是拿它和 latest.json 里的版本比较。
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # 布尔 input 在不同触发方式下的字面形态不一致，这里统一归一化成 true/false，
      # 免得把「勾了草稿」误判成正式发布（或反过来）。
      - id: flags
        env:
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          case "${INPUT_DRAFT:-false}" in
            true|True|TRUE) draft=true ;;
            *) draft=false ;;
          esac
          echo "发布形态：$([ "$draft" = true ] && echo 草稿（不公开，仅验证构建） || echo 正式发布)"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

      # Release 必须**只创建一次**。六个构建 job 是并发的，而 tauri-action 用
      # `GET /releases/tags/<tag>` 找已有 Release —— 这个接口**不返回草稿**，于是每个 job
      # 都以为不存在、各自建一份。实测就是这样：同一个标签下出现两份草稿 Release，产物被劈成
      # 两半（一份只有 macOS + Windows x64，另一份没有 Windows x64，两份的 latest.json 都不全）。
      # 这里先幂等地建好，再把 id 交给六个 job（tauri-action 的 releaseId 输入），它们就只上传、
      # 不再创建，竞态从根上消失。
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check.outputs.tag }}
          VERSION: ${{ steps.check.outputs.version }}
          DRAFT: ${{ steps.flags.outputs.draft }}
        run: |
          set -euo pipefail
          body=$(sed "s/{{VERSION}}/$VERSION/g" .github/release-body.md)
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "map(select(.tag_name == \"$TAG\")) | .[0].id // empty")
          if [ -n "$id" ]; then
            echo "复用已存在的 Release：标签 $TAG，id=$id"
          else
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" \
              -f name="Daylight $VERSION" \
              -f body="$body" \
              -f target_commitish="$GITHUB_SHA" \
              -F draft="$DRAFT" \
              -F prerelease=false \
              --jq .id)
            echo "已创建 $([ "$DRAFT" = true ] && echo 草稿 || echo 正式) Release：标签 $TAG，id=$id"
          fi
          # 下游拿不到 id 就等于产物无处可传，必须在这里失败，不能让它空着往下走。
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "::error::没能拿到 Release id，后面的上传无从进行。"
            exit 1
          fi
          echo "releaseId=$id" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台失败不影响其他平台；失败的平台在 Release 里就是缺这个产物，其余照常可用。
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64,   os: macos-14,         target: aarch64-apple-darwin }
          # Intel Mac 已在 Apple Silicon 上交叉构建：GitHub 不再提供 x64 的 macOS runner，
          # 而 prepare-desktop.mjs 会把内置 Node 换成官方 darwin-x64 版本，架构不会错配。
          - { name: macos-x64,     os: macos-14,         target: x86_64-apple-darwin }
          - { name: linux-x64,     os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu }
          - { name: linux-arm64,   os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { name: windows-x64,   os: windows-latest,   target: x86_64-pc-windows-msvc }
          - { name: windows-arm64, os: windows-11-arm,   target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Linux 系统依赖（WebKitGTK / 托盘 / AppImage）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      # macOS 签名与公证是可选的：仓库里没有配置证书时，产出的 .app 是未签名的（首次打开需要
      # 在「系统设置 → 隐私与安全性」里放行）。下面这段只在 APPLE_CERTIFICATE 存在时才注入变量，
      # 空变量会让 Tauri 的打包器直接报错，所以不能无条件写进 env。
      - name: 配置 macOS 签名与公证
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "未配置 APPLE_CERTIFICATE，跳过签名与公证（产出的应用未签名）。"
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE<<APPLE_CERT_EOF"
            echo "$APPLE_CERTIFICATE"
            echo "APPLE_CERT_EOF"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"
          echo "已注入 macOS 签名与公证配置。"

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 自动更新的签名私钥。缺失时打包器会在「生成更新产物」这一步直接失败，
          # 这是刻意的：没有签名就不能发布更新，否则客户端会拒绝安装（也挡住了被篡改的包）。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 让 prepare-desktop.mjs 按目标平台挑选内置 Node 与原生模块架构。
          DAYLIGHT_TARGET_TRIPLE: ${{ matrix.target }}
        with:
          # Release 由上面的 guard 作业幂等创建，这里只按 id 上传产物。
          # 不能再让 tauri-action 按 tagName 去找/建：它找已有 Release 用的接口不返回草稿，
          # 六个并发 job 会各自创建一份（实测产物被劈成两半，见 guard 里那段注释）。
          releaseId: ${{ needs.guard.outputs.releaseId }}
          # 生成并上传 latest.json 与各平台的 .sig 签名，客户端据此自动更新。
          uploadUpdaterJson: true
          # Windows 的自动更新只能装 NSIS（setup.exe），装不了 WiX（.msi）。
          # `targets: "all"` 会让两者都存在，这里必须显式选 NSIS，否则客户端会拿到装不上的 .msi。
          updaterJsonPreferNsis: true
          # 上传偶发失败时重试，避免整次发布因为一次抖动作废。
          retryAttempts: 2
          # --verbose 不是「顺手加的日志」：Tauri 的打包器只在日志级别为 Error 时走
          # 「丢掉外部工具的 stderr、只留一句 failed to run linuxdeploy」那条路；
          # 级别更高时改用 output_ok()，它会把工具 stderr 里的真实原因拼进错误信息。
          # 没有这个开关时，AppImage 打包失败在 CI 上就是一句没有任何线索的话。
          args: --target ${{ matrix.target }} --verbose

      # 打包失败时把现场打出来。linuxdeploy 这类外部工具只在 --verbose 下才会把 stderr 带进
      # 错误信息，剩下的（AppDir 结构、体积、tz 缓存里的工具）只能靠这一步。
      - name: 诊断（仅失败时，仅 Linux）：打印 AppImage 打包现场
        if: failure() && runner.os == 'Linux'
        run: |
          set +e
          echo "=== 打包产物目录 ==="
          find src-tauri/target -maxdepth 6 -path '*bundle*' -type d 2>/dev/null | head -20
          echo
          echo "=== tauri 缓存里的打包工具 ==="
          ls -la "$HOME/.cache/tauri" 2>/dev/null
          echo
          APP_DIR=$(find src-tauri/target -maxdepth 6 -name '*.AppDir' -type d 2>/dev/null | head -1)
          echo "=== AppDir（失败时 Tauri 不会清理）：$APP_DIR ==="
          if [ -n "$APP_DIR" ]; then
            ls -la "$APP_DIR"
            echo "--- usr/bin ---"
            ls -la "$APP_DIR/usr/bin" 2>/dev/null
            echo "--- usr/lib 各子目录体积 ---"
            du -sh "$APP_DIR"/usr/lib/* 2>/dev/null | sort -h | tail -15
            echo "--- 整个 AppDir 体积 / 文件数 ---"
            du -sh "$APP_DIR"
            find "$APP_DIR" -type f | wc -l
            echo "--- 里面所有 ELF 文件（linuxdeploy 会对它们逐个跑 ldd）---"
            find "$APP_DIR" -type f -exec sh -c 'head -c4 "$1" | grep -q "^.ELF" && echo "$1"' _ {} \; 2>/dev/null | head -20
          fi
          exit 0

  # 六个平台都上传完之后，把 latest.json 里指向 GitHub 资产 API 的地址改成公开下载地址。
  # tauri-action 生成的是 https://api.github.com/.../releases/assets/<id>：实测不带凭据、用客户端
  # 那样普通的 Accept 头请求它，返回的是**资产元数据 JSON**（不是安装包），自动更新会下载到一段
  # JSON、签名校验必然失败。顺带在这里卡住「哪个平台没传上来」——latest.json 缺平台就不许对外发布。
  finalize:
    name: 修整 latest.json
    needs: [guard, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 改成公开下载地址，并确认六个平台都在
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/fix-latest-json.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --tag "${{ needs.guard.outputs.tag }}" \
            --release-id "${{ needs.guard.outputs.releaseId }}"
