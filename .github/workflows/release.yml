name: release

# 打标签即发布：六平台安装包 + 自动更新用的 latest.json。
# 触发方式（二选一）：
#   1) 推一个版本标签：  git tag v0.1.0 && git push origin v0.1.0
#   2) Actions 页面手动运行本工作流，填一个标签；勾上 draft 则只产出**草稿** Release，
#      用来在不公开的前提下验证六平台能不能都出包。草稿确认无误后，**直接在 Releases
#      页面发布这份草稿**即可；注意 guard 会幂等复用同一标签下已存在的草稿，
#      所以「取消勾选 draft 再跑一次」并不会把已有草稿改成正式发布。
#
# 再触发一次是**正常的**：在 Releases 页面发布草稿会创建 Git 标签，而本工作流是
# `push: tags: v*` 触发的，于是发布完会立刻再跑一次。那一次由 guard 判定「该标签已正式
# 发布」→ 整体跳过（空操作，不重建、不改 latest.json），所以是预期的绿灯。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '版本标签，例如 v0.1.0（标签不存在时会在本次运行的提交上创建）'
        required: true
      draft:
        description: '只产出草稿 Release（不公开），用于验证六平台构建'
        type: boolean
        default: false

# tauri-action 需要写权限来创建 Release 并上传产物。
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 先挡住「标签版本与代码里的版本不一致」这一类最容易发错包的问题。
  guard:
    name: 校验版本
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      draft: ${{ steps.flags.outputs.draft }}
      releaseId: ${{ steps.release.outputs.releaseId }}
      skip: ${{ steps.release.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: check
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          case "$tag" in
            v*) ;;
            *) echo "::error::标签必须以 v 开头（当前 '$tag'）。推送形如 v0.1.0 的标签，或手动运行时填写它。"; exit 1 ;;
          esac
          version="${tag#v}"
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "标签：$tag"
          echo "package.json=$pkg  tauri.conf.json=$conf  Cargo.toml=$cargo"
          for pair in "package.json:$pkg" "src-tauri/tauri.conf.json:$conf" "src-tauri/Cargo.toml:$cargo"; do
            file="${pair%%:*}"; value="${pair#*:}"
            if [ "$value" != "$version" ]; then
              echo "::error::$file 的版本是 $value，与标签 $tag 不一致。请把三处版本都改成 $version 并提交，再重新打标签。"
              exit 1
            fi
          done
          # 应用版本号以 tauri.conf.json 为准：自动更新就是拿它和 latest.json 里的版本比较。
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # 布尔 input 在不同触发方式下的字面形态不一致，这里统一归一化成 true/false，
      # 免得把「勾了草稿」误判成正式发布（或反过来）。
      - id: flags
        env:
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          case "${INPUT_DRAFT:-false}" in
            true|True|TRUE) draft=true ;;
            *) draft=false ;;
          esac
          echo "发布形态：$([ "$draft" = true ] && echo 草稿（不公开，仅验证构建） || echo 正式发布)"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

      # Release 必须**只创建一次**。六个构建 job 是并发的，而 tauri-action 用
      # `GET /releases/tags/<tag>` 找已有 Release —— 这个接口**不返回草稿**，于是每个 job
      # 都以为不存在、各自建一份。实测就是这样：同一个标签下出现两份草稿 Release，产物被劈成
      # 两半（一份只有 macOS + Windows x64，另一份没有 Windows x64，两份的 latest.json 都不全）。
      # 这里先幂等地建好，再把 id 交给六个 job（tauri-action 的 releaseId 输入），它们就只上传、
      # 不再创建，竞态从根上消失。
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check.outputs.tag }}
          VERSION: ${{ steps.check.outputs.version }}
          DRAFT: ${{ steps.flags.outputs.draft }}
        run: |
          set -euo pipefail
          body=$(sed "s/{{VERSION}}/$VERSION/g" .github/release-body.md)
          # 查「本标签的已有 Release」时**不能只按 tag_name 匹配**：草稿的 Git 标签还没创建，
          # GitHub 会把草稿的 tag_name 归一化成 `untagged-<hash>`（v0.1.1 实测踩到——同一个
          # release id 先读到 v0.1.1、后读到 `untagged-31966041b60bbb551d4c`）。只按 tag_name
          # 查会在重跑时找不到自己的草稿，于是再建一份重复草稿（正是先前那个「产物被劈成两半」
          # 缺陷的另一个面孔）。所以草稿按 name（创建时写死为 `Daylight <版本>`）一起匹配。
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "map(select(.tag_name == \"$TAG\" or (.draft and .name == \"Daylight $VERSION\"))) | .[0].id // empty")
          skip=false
          if [ -n "$id" ]; then
            isdraft=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq '.draft')
            if [ "$isdraft" = "true" ]; then
              # 复用草稿时**必须**把 target_commitish 拉到本次运行的提交：草稿阶段 Git 标签还没
              # 创建，target_commitish 是决定「发布后标签指向哪里」的唯一依据。v0.1.0 就踩过：
              # 草稿由更早一次运行创建、产物由后来这次运行构建，结果标签指向 f6e005e，而 27 个
              # 产物全部产自 0cae10b，差了两个提交。
              # 同时把 tag_name 写回目标标签：若它已被归一化成 `untagged-<hash>`，发布时就会
              # 创建一个名叫 `untagged-…` 的标签（v0.1.1 发布前实测发现，已手工写回）。
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
                -f tag_name="$TAG" \
                -f target_commitish="$GITHUB_SHA" > /dev/null
              echo "复用已存在的草稿 Release：标签 $TAG，id=$id，target_commitish → ${GITHUB_SHA:0:7}"
            else
              # 已经正式发布 → 本轮什么都不做。
              #
              # 为什么必须有这条：**发布草稿这个动作本身会创建 Git 标签**，而本工作流是
              # `push: tags: v*` 触发的，于是「发布」会立刻再触发一次本工作流。如果那时还去
              # 重建，就会把已经发出去的产物和 latest.json 重写一遍——实测就是这么坏的：
              # 发布 4 分钟后第二轮跑起来，把 Linux 资产换成新构建的，latest.json 被中途重写成
              # 12 个键指向 asset API 地址，客户端会「下载」到一段 JSON。已发布的产物不可替换。
              skip=true
              echo "标签 $TAG 的 Release 已经正式发布，跳过本次构建（已发布的产物不可替换）。"
              gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq '"  " + .html_url'
            fi
          else
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" \
              -f name="Daylight $VERSION" \
              -f body="$body" \
              -f target_commitish="$GITHUB_SHA" \
              -F draft="$DRAFT" \
              -F prerelease=false \
              --jq .id)
            echo "已创建 $([ "$DRAFT" = true ] && echo 草稿 || echo 正式) Release：标签 $TAG，id=$id"
          fi
          # 下游拿不到 id 就等于产物无处可传，必须在这里失败，不能让它空着往下走。
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "::error::没能拿到 Release id，后面的上传无从进行。"
            exit 1
          fi
          echo "releaseId=$id" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: guard
    # 标签下的 Release 若已正式发布，guard 会给出 skip=true：这一轮整体跳过，什么都不动。
    # （发布草稿这个动作会创建 Git 标签，而本工作流是 `push: tags: v*` 触发的，所以「发布」
    # 立刻会再跑一次本工作流——那一次必须是空操作，不能重建已发出的产物。）
    if: needs.guard.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台失败不影响其他平台；失败的平台在 Release 里就是缺这个产物，其余照常可用。
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64,   os: macos-14,         target: aarch64-apple-darwin }
          # Intel Mac 已在 Apple Silicon 上交叉构建：GitHub 不再提供 x64 的 macOS runner，
          # 而 prepare-desktop.mjs 会把内置 Node 换成官方 darwin-x64 版本，架构不会错配。
          - { name: macos-x64,     os: macos-14,         target: x86_64-apple-darwin }
          - { name: linux-x64,     os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu }
          - { name: linux-arm64,   os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { name: windows-x64,   os: windows-latest,   target: x86_64-pc-windows-msvc }
          - { name: windows-arm64, os: windows-11-arm,   target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Linux 系统依赖（WebKitGTK / 托盘 / AppImage）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      # macOS 签名与公证：配了证书就正式签名 + 公证；**没有证书也必须至少做 ad-hoc 签名**。
      #
      # 不能把「未签名」理解成「只是多一个提示」：Tauri 在没有签名身份时，只留下链接器自动加的
      # 那个 ad-hoc 签名，**不会**给 .app 生成 _CodeSignature/CodeResources。这样的包在 Apple
      # Silicon 上被 macOS 判成「已损坏，无法打开」，用户根本装不上（v0.1.0 实测如此：挂载 DMG
      # 后 codesign --verify 报 "code has no resources but signature indicates they must be
      # present"，而有证书时的正式签名才不会）。ad-hoc 签名之后仍是「未验证的开发者」，用户
      # 需要在「系统设置 → 隐私与安全性」放行一次，但那不再是「损坏」。
      # 下面这段只在 APPLE_CERTIFICATE 存在时才注入证书变量，空变量会让打包器直接报错。
      - name: 配置 macOS 签名与公证
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "未配置 APPLE_CERTIFICATE：改为 ad-hoc 签名（包可安装，用户首次需放行一次），不做公证。"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE<<APPLE_CERT_EOF"
            echo "$APPLE_CERTIFICATE"
            echo "APPLE_CERT_EOF"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"
          echo "已注入 macOS 签名与公证配置。"

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 自动更新的签名私钥。缺失时打包器会在「生成更新产物」这一步直接失败，
          # 这是刻意的：没有签名就不能发布更新，否则客户端会拒绝安装（也挡住了被篡改的包）。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 让 prepare-desktop.mjs 按目标平台挑选内置 Node 与原生模块架构。
          DAYLIGHT_TARGET_TRIPLE: ${{ matrix.target }}
        with:
          # Release 由上面的 guard 作业幂等创建，这里只按 id 上传产物。
          # 不能再让 tauri-action 按 tagName 去找/建：它找已有 Release 用的接口不返回草稿，
          # 六个并发 job 会各自创建一份（实测产物被劈成两半，见 guard 里那段注释）。
          releaseId: ${{ needs.guard.outputs.releaseId }}
          # 生成并上传 latest.json 与各平台的 .sig 签名，客户端据此自动更新。
          uploadUpdaterJson: true
          # Windows 的自动更新只能装 NSIS（setup.exe），装不了 WiX（.msi）。
          # `targets: "all"` 会让两者都存在，这里必须显式选 NSIS，否则客户端会拿到装不上的 .msi。
          updaterJsonPreferNsis: true
          # 上传偶发失败时重试，避免整次发布因为一次抖动作废。
          retryAttempts: 2
          # --verbose 不是「顺手加的日志」：Tauri 的打包器只在日志级别为 Error 时走
          # 「丢掉外部工具的 stderr、只留一句 failed to run linuxdeploy」那条路；
          # 级别更高时改用 output_ok()，它会把工具 stderr 里的真实原因拼进错误信息。
          # 没有这个开关时，AppImage 打包失败在 CI 上就是一句没有任何线索的话。
          args: --target ${{ matrix.target }} --verbose

      # 未签名的 macOS 包在 Apple Silicon 上是「已损坏，无法打开」——用户下载后才发现这件事，
      # 代价是整个版本不可用（v0.1.0 就是这样）。所以在 CI 里直接对刚打出来的 .app 做一次真校验，
      # 签名缺失时在这里就红，不会流到 Release 上。校验的是磁盘上的 bundle，而 DMG 与
      # .app.tar.gz 都由同一个 bundle 生成，它们自然同源。
      - name: 校验 macOS 产物已签名（未签名 = Apple Silicon 上「已损坏」）
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # 本机构建落在 target/release，交叉构建（Intel Mac 包在 arm64 runner 上打）带三元组前缀，
          # 所以先按 target 路径找，找不到再回落、再全树找——但不能找不到就算过。
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Daylight.app"
          if [ ! -d "$app" ]; then
            app="src-tauri/target/release/bundle/macos/Daylight.app"
          fi
          if [ ! -d "$app" ]; then
            app=$(find src-tauri/target -maxdepth 7 -type d -name 'Daylight.app' | head -1)
          fi
          if [ -z "${app:-}" ] || [ ! -d "$app" ]; then
            echo "::error::找不到任何 Daylight.app，无法校验签名"
            find src-tauri/target -maxdepth 7 -path '*bundle*' -type d || true
            exit 1
          fi
          echo "校验对象：$app"
          if [ ! -f "$app/Contents/_CodeSignature/CodeResources" ]; then
            echo "::error::$app 缺少 _CodeSignature/CodeResources：没有做整包签名，Apple Silicon 上会显示「已损坏，无法打开」"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
          echo "✓ 已整包签名并通过校验"
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E '^(Identifier|Signature|TeamIdentifier)=' || true

      # 打包失败时把现场打出来。linuxdeploy 这类外部工具只在 --verbose 下才会把 stderr 带进
      # 错误信息，剩下的（AppDir 结构、体积、tz 缓存里的工具）只能靠这一步。
      - name: 诊断（仅失败时，仅 Linux）：打印 AppImage 打包现场
        if: failure() && runner.os == 'Linux'
        run: |
          set +e
          echo "=== 打包产物目录 ==="
          find src-tauri/target -maxdepth 6 -path '*bundle*' -type d 2>/dev/null | head -20
          echo
          echo "=== tauri 缓存里的打包工具 ==="
          ls -la "$HOME/.cache/tauri" 2>/dev/null
          echo
          APP_DIR=$(find src-tauri/target -maxdepth 6 -name '*.AppDir' -type d 2>/dev/null | head -1)
          echo "=== AppDir（失败时 Tauri 不会清理）：$APP_DIR ==="
          if [ -n "$APP_DIR" ]; then
            ls -la "$APP_DIR"
            echo "--- usr/bin ---"
            ls -la "$APP_DIR/usr/bin" 2>/dev/null
            echo "--- usr/lib 各子目录体积 ---"
            du -sh "$APP_DIR"/usr/lib/* 2>/dev/null | sort -h | tail -15
            echo "--- 整个 AppDir 体积 / 文件数 ---"
            du -sh "$APP_DIR"
            find "$APP_DIR" -type f | wc -l
            echo "--- 里面所有 ELF 文件（linuxdeploy 会对它们逐个跑 ldd）---"
            find "$APP_DIR" -type f -exec sh -c 'head -c4 "$1" | grep -q "^.ELF" && echo "$1"' _ {} \; 2>/dev/null | head -20
          fi
          exit 0

  # 六个平台都上传完之后，把 latest.json 里指向 GitHub 资产 API 的地址改成公开下载地址。
  # tauri-action 生成的是 https://api.github.com/.../releases/assets/<id>：实测不带凭据、用客户端
  # 那样普通的 Accept 头请求它，返回的是**资产元数据 JSON**（不是安装包），自动更新会下载到一段
  # JSON、签名校验必然失败。顺带在这里卡住「哪个平台没传上来」——latest.json 缺平台就不许对外发布。
  finalize:
    name: 修整 latest.json
    needs: [guard, build]
    # build 被跳过（skip=true）时本作业也会自动跳过：这条路不需要再修整 latest.json。
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 改成公开下载地址，并确认六个平台都在
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/fix-latest-json.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --tag "${{ needs.guard.outputs.tag }}" \
            --release-id "${{ needs.guard.outputs.releaseId }}"
